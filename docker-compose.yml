services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: newnorth
      POSTGRES_PASSWORD: newnorth
      POSTGRES_DB: newnorth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://newnorth:newnorth@db:5432/newnorth?sslmode=disable
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    profiles:
      - production

  frontend-dev:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install -g pnpm && pnpm install && pnpm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=/api
      - VITE_API_PROXY_TARGET=http://backend:8080
    depends_on:
      - backend
    profiles:
      - dev

volumes:
  pgdata:
  frontend-node-modules:
